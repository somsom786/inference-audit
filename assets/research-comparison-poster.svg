<text x="62" y="566" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start">Sybil Solutions / 0xSero published the right-hand results independently. They are not a customer or affiliate of Inference Audit Labs,</text><text x="62" y="586" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start">and this poster is not an endorsement. Hardware, models and engines differ, so the two columns are not a head-to-head comparison.</text><text x="62" y="610" fill="#c2c0ad" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="start">Source: github.com/sybil-solutions (local-ai-registry PR 453, trellis-serve, inference-optimisation-skill). Not independently reproduced.</text>
