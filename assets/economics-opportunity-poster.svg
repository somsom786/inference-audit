<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<title>Illustrative economics of qualified inference throughput gains</title>
<rect width="1200" height="630" fill="#201f1c"/>
<rect x="0" y="0" width="12" height="630" fill="#d4e68d"/>
<text x="62" y="54" fill="#d4e68d" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="start">INFERENCE AUDIT LABS · ECONOMICS</text>
<text x="62" y="106" fill="#f4f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" text-anchor="start">More inference. Same GPU budget.</text>
<text x="62" y="140" fill="#c2c0ad" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="normal" text-anchor="start">What qualified throughput gains could be worth at $50K/month</text>
<path d="M62 160H1138" stroke="#6a6b57" stroke-width="1" fill="none"/>
<text x="62" y="196" fill="#c2c0ad" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" text-anchor="start">ILLUSTRATIVE CONDITIONAL SCENARIO · $50,000/month GPU spend ($600,000/year) held at constant demand</text>
<rect x="62" y="212" width="340" height="300" fill="#2b2a26" stroke="#d4e68d" stroke-width="2"/>
<text x="86" y="250" fill="#c2c0ad" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="start">+30% qualified throughput</text>
<text x="86" y="330" fill="#d4e68d" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="bold" text-anchor="start">23.1%</text>
<text x="86" y="368" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start">fewer GPU-hours</text>
<path d="M86 390H378" stroke="#6a6b57" fill="none"/>
<text x="86" y="428" fill="#c2c0ad" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">up to</text>
<text x="86" y="466" fill="#d4e68d" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" text-anchor="start">$138,462/yr</text>
<text x="86" y="494" fill="#c2c0ad" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start">conditional, at constant demand</text>
<rect x="430" y="212" width="340" height="300" fill="#2b2a26" stroke="#6a6b57" stroke-width="1"/>
<text x="454" y="250" fill="#c2c0ad" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="start">+50% qualified throughput</text>
<text x="454" y="330" fill="#f4f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="bold" text-anchor="start">33.3%</text>
<text x="454" y="368" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start">fewer GPU-hours</text>
<path d="M454 390H746" stroke="#6a6b57" fill="none"/>
<text x="454" y="428" fill="#c2c0ad" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">up to</text>
<text x="454" y="466" fill="#f4f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" text-anchor="start">$200,000/yr</text>
<text x="454" y="494" fill="#c2c0ad" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start">conditional, at constant demand</text>
<rect x="798" y="212" width="340" height="300" fill="#2b2a26" stroke="#6a6b57" stroke-width="1"/>
<text x="822" y="250" fill="#c2c0ad" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="start">+100% qualified throughput</text>
<text x="822" y="330" fill="#f4f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="bold" text-anchor="start">50.0%</text>
<text x="822" y="368" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" text-anchor="start">fewer GPU-hours</text>
<path d="M822 390H1114" stroke="#6a6b57" fill="none"/>
<text x="822" y="428" fill="#c2c0ad" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">up to</text>
<text x="822" y="466" fill="#f4f1e8" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="bold" text-anchor="start">$300,000/yr</text>
<text x="822" y="494" fill="#c2c0ad" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start">conditional, at constant demand</text>
<path d="M62 540H1138" stroke="#6a6b57" stroke-width="1" fill="none"/>
<text x="62" y="566" fill="#f4f1e8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start">GPU-hours saved = 1 − 1/(1 + g). Applies only if the added throughput is qualified on your workload.</text><text x="62" y="592" fill="#c2c0ad" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start">Not a measured customer saving. Depends on billing granularity, scheduling, deadlines and quality gates. Scenario arithmetic only.</text>
</svg>
