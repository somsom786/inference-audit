name: Offline tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the Windows runtime used for the 0.2.1 acceptance runs.
          - os: windows-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      # Use Windows stubs for process-control constants. Runtime tests run on both hosts.
      - run: mypy --platform win32 src

