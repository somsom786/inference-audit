[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "inference-audit"
version = "0.2.1"
description = "Bounded inference benchmarking and evidence-backed diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx==0.28.1", "httpcore==1.0.9", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.15.7", "mypy==1.19.1", "types-PyYAML==6.0.12.20250915"]

[project.scripts]
inference-audit = "inference_audit.cli:main"

[tool.ruff]
line-length = 110

[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

