label: Approved staging sample
target:
  url: https://staging.example.invalid
  model: approved-model-id
  credential_env: INFERENCE_AUDIT_TOKEN
authorization:
  approved: false
  allowed_origins:
    - https://staging.example.invalid
limits:
  max_requests: 200
  runtime_s: 400
  timeout_s: 20
  max_concurrency: 4
  max_rps: 2
  dispatch_slack_s: 0.5
stages:
  - {name: low, pattern: mixed, fixture_set: mix1, count: 80, mode: open, workers: 4, rate: 0.6}
  - {name: higher, pattern: mixed, fixture_set: mix1, count: 80, mode: open, workers: 4, rate: 1.0}

